docker {
    javaApplication {
        ports = [ 8080 ]
        baseImage = 'eclipse-temurin:17.0.7_7-jre-alpine'
        images = [ findProperty('dockerreg') + (findProperty('image') ?: project.name) ]
        maintainer = 'gastendonk'
        mainClassName = application.mainClass
    }
}

dockerBuildImage {
    doFirst {
        if (!findProperty('dockerreg')) {
            throw new GradleException('Please specify -Pdockerreg=...')
        }
    }
}

dockerCreateDockerfile {
    outputs.upToDateWhen { false }
    doLast {
        def dockerfile = destFile.get().asFile
        dockerfile.text = dockerfile.text.replace('FROM eclipse-temurin',
            'FROM prom/prometheus:v3.11.2-busybox AS promtool-provider\nFROM eclipse-temurin').replace('WORKDIR',
            'RUN apk add bash nano\n' +
            'COPY --from=promtool-provider /bin/promtool /usr/local/bin/promtool\n' +
            'ENV PROMTOOL=/usr/local/bin/promtool\n' +
            'WORKDIR').replace('8080', '4317 4318 8888 8080')
    }
}
