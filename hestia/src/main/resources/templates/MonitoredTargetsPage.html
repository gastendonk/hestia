{{master: master}}

<div class="row"> 
    <div class="col-lg-12">
        <h1 class="page-header">{{header}}</h1>
        <p class="mb2">{{N.Environment}}: {{cenv}}</p>
        
        {{if not customer}}
	        <p>
	            <a href="/{{branch}}/mt/{{id}}/add?m=linux" class="btn btn-default br">{{N.AddMTLinuxServer}}</a>
	            <a href="/{{branch}}/mt/{{id}}/add?m=oracle" class="btn btn-default br">{{N.AddMTOracleDB}}</a>
	            <a href="/{{branch}}/mt/{{id}}/add?m=postgres" class="btn btn-default br">{{N.AddMTPostgresDB}}</a>
	            <a href="/{{branch}}/mt/{{id}}/add?m=site" class="btn btn-default br">{{N.AddMTSite}}</a>
	            <a href="/{{branch}}/mt/{{id}}/add?m=definition" class="btn btn-default br">{{N.AddMTDefinition}}</a>
	        </p>
        {{/if}}
        
        {{if list}}
            {{table}}
        {{/if}}
    </div>
</div>
