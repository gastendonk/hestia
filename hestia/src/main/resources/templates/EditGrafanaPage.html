{{master: master}}

<div class="row"> 
    <div class="col-lg-12">
        <h1 class="page-header">{{header}}</h1>

        <form class="form-horizontal" method="post">
            <fieldset>
                <div class="form-group">
                    <label for="name" class="col-lg-1 control-label">Name</label>
                    <div class="col-lg-4">
                        <input type="text" class="form-control" id="name" name="name" value="{{name}}" autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="host" class="col-lg-1 control-label">Host</label>
                    <div class="col-lg-4">
                        <input type="text" class="form-control" id="host" name="host" value="{{host}}">
                    </div>
                </div>
                <div class="form-group">
                    <label for="token" class="col-lg-1 control-label">Token</label>
                    <div class="col-lg-4">
                        <input type="password" class="form-control" id="token" name="token" value="{{token}}">
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-lg-offset-1 col-lg-5">
                        <button type="submit" class="btn btn-primary br">{{N.Save}}</button>
                        <a href="/{{branch}}/grafana" class="btn btn-default">{{N.Cancel}}</a>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
</div>
