{{master: master}}

<div class="row"> 
    <div class="col-lg-12">
        <h1 class="page-header">{{header}}</h1>

        <p><a href="/{{branch}}/grafana/add" class="btn btn-primary">{{N.AddGrafana}}</a></p>
        
        {{if list}}
            {{table}}

            <hr>
	        {{each g in list}}
	            <h2>{{g.name}}</h2>
	            {{if g.reason}}
	                <p class="tfRed">{{N.grafanaNotAccessible}}. ({{g.reason}})</p>
	            {{/if}}
	            {{if g.dashboards}}
	                {{g.dtable}}
	            {{/if}}
	        {{/each}}
        {{/if}}
    </div>
</div>

<style>
.mt0 {
    margin-top: 0 !important;
}
</style>
