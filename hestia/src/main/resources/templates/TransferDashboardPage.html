{{master: master}}

<div class="row"> 
    <div class="col-lg-12">
        <h1 class="page-header">{{header}} <a href="/{{branch}}/grafana" class="btn btn-sm btn-default"><i class="fa fa-arrow-left"></i></a></h1>
        
        <p>{{N.Source}} Grafana: {{srcG}} | Dashboard: <b>{{srcD}}</b></p>
        
        {{if modus1}}
            <h2>{{N.SelectTargetGrafana}}</h2>
            
            {{each g in grafanaList}}
                <p><a href="{{g.link}}">{{g.name}}</a></p>
            {{/each}}
        {{else}}
            <h2 class="mb1">{{N.MapDatasource}}</h2>
            
            <form action="transfer?target={{target}}" class="form-horizontal" method="post">
                <fieldset>
                    {{each d in datasources}}
                        <div class="form-group">
                            <label for="ds{{d.i}}" class="col-lg-2 control-label">{{d.name}} [{{d.uid}}]</label>
                            <div class="col-lg-3">
                                <select class="form-control" id="ds{{d.i}}" name="ds{{d.i}}">
                                    {{each t in d.targets}}
                                        <option value="{{t.id}}"{{if t.selected}} selected{{/if}}>{{t.name}}</option>
                                    {{/each}}
                                </select>
                            </div>
                        </div>
                    {{/each}}
                    
                    <div class="form-group">
                        <div class="col-lg-offset-2 col-lg-5">
                            <button type="submit" class="btn btn-primary br" onclick="document.querySelector('#s1').style='';">{{N.Save}}
                                <i id="s1" class="fa fa-delicious fa-spin" style="display: none;"></i></button>
                        </div>
                    </div>
                </fieldset>
            </form>
        {{/if}}
        
        <hr>
        <h2 style="margin-top: 4cm;">Dashboard JSON</h2>
        <pre style="max-width: 90vw;">{{json}}</pre>

    </div>
</div>
